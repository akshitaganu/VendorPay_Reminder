<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3A56A"/>
      <stop offset="1" stop-color="#D97F42"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#g)"/>
  <circle cx="50" cy="50" r="41" fill="#FCEEDD"/>

  <!-- Calendar watermark -->
  <g opacity="0.16">
    <rect x="26" y="26" width="48" height="44" rx="5" fill="#B8863F"/>
    <rect x="26" y="26" width="48" height="11" rx="5" fill="#8A5F26"/>
    <rect x="34" y="20" width="5" height="11" rx="2.5" fill="#8A5F26"/>
    <rect x="61" y="20" width="5" height="11" rx="2.5" fill="#8A5F26"/>
    <line x1="34" y1="46" x2="66" y2="46" stroke="#FCEEDD" stroke-width="2"/>
    <line x1="34" y1="55" x2="66" y2="55" stroke="#FCEEDD" stroke-width="2"/>
    <line x1="34" y1="64" x2="52" y2="64" stroke="#FCEEDD" stroke-width="2"/>
  </g>

  <!-- Receiving hand (bottom-left, cupped) -->
  <path d="M8 68 L32 66 L40 76 L12 88 Q6 88 6 82 L6 72 Q6 68 8 68 Z" fill="#1F6E63"/>
  <path d="M29 61 Q38 57 45 64 L47 75 Q41 82 32 77 Q25 72 29 61 Z" fill="#F2B48C"/>

  <!-- Cash stack (behind note, slight offset) -->
  <g transform="rotate(14 52 52) translate(-3,4)">
    <rect x="33" y="34" width="36" height="21" rx="3" fill="#EFC488" stroke="#B8863F" stroke-width="1.2"/>
  </g>

  <!-- Cash note (front) with rupee symbol -->
  <g transform="rotate(14 52 52)">
    <rect x="33" y="34" width="36" height="21" rx="3" fill="#F8DFAE" stroke="#B8863F" stroke-width="1.6"/>
    <circle cx="51" cy="44.5" r="6.5" fill="none" stroke="#B8863F" stroke-width="1.4"/>
    <text x="51" y="48.3" font-size="9.5" font-weight="700" fill="#B8863F" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">₹</text>
    <line x1="37" y1="38" x2="41" y2="38" stroke="#B8863F" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="61" y1="51" x2="65" y2="51" stroke="#B8863F" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Giving hand (top-right, sleeve + fingers pinching note) -->
  <path d="M62 12 L90 12 Q95 12 95 17 L95 28 Q95 33 90 33 L68 33 L62 22 Z" fill="#1E2530"/>
  <path d="M57 28 Q64 23 71 30 L68 42 Q61 47 55 40 Z" fill="#F2B48C"/>
</svg>
